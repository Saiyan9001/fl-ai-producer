name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run repository audit
        run: |
          python tools/audit_repo.py
  
  test:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyzmq pydantic
      
      - name: Run tests
        run: |
          python -m pytest controller_app/tests/ -v
  
  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyzmq pydantic
      
      - name: Run agent self-test
        run: |
          python -m controller_app.ai.agent --selftest
      
      - name: Run provider check
        run: |
          python -m controller_app.ai.agent --provider-check
  
  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r controller_app/requirements.txt
          pip install pyinstaller
      
      - name: Build Windows executable
        run: |
          cd controller_app/packaging
          ./build.ps1
        shell: pwsh
      
      - name: Upload executable artifact
        uses: actions/upload-artifact@v3
        with:
          name: fl-ai-producer-windows
          path: controller_app/dist/fl-ai-producer.exe
          retention-days: 30
